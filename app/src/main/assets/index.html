<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>今天吃什么</title>
<style>
  :root {
    --primary: #ff6b35; --primary-dark: #e85a2a; --bg: #fff8f3; --card: #fff;
    --text: #2b2118; --muted: #8a7a6d; --line: #f0e4da; --ok: #2fa36b; --danger: #e5484d;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  header { background: var(--primary); color: #fff; padding: 14px 16px; font-size: 18px; font-weight: 600; }
  main { padding: 16px 16px 90px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid var(--line); }
  nav button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 13px; color: var(--muted); }
  nav button b { display: block; font-size: 20px; font-weight: normal; }
  nav button.active { color: var(--primary); }
  .page { display: none; } .page.active { display: block; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  /* 转盘 */
  .wheel-wrap { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: 4px auto 0; }
  .wheel-disc { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 8px 24px rgba(232,90,42,.25); }
  .wheel-disc canvas { width: 100%; height: 100%; display: block; will-change: transform; }
  .pointer { position: absolute; left: 50%; top: -6px; width: 30px; height: 40px; margin-left: -15px; transform-origin: 50% 12px; z-index: 2; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); will-change: transform; }
  .hub { position: absolute; left: 50%; top: 50%; width: 27%; height: 27%; transform: translate(-50%,-50%); border-radius: 50%; border: 4px solid #fff;
    background: radial-gradient(circle at 35% 30%, #ff9a6b, var(--primary) 60%, var(--primary-dark)); color: #fff; font-size: 20px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(232,90,42,.45); transition: transform 160ms var(--ease-out); z-index: 3; }
  .hub:active { transform: translate(-50%,-50%) scale(.97); }
  .hub:disabled { opacity: 1; }
  /* 空闲时外圈一道光环向外扩散，提示可以点；只动 transform/opacity */
  .hub::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--primary); opacity: 0; pointer-events: none; }
  .hub.idle::after { animation: ring 2.4s var(--ease-out) infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(1.35); opacity: 0; } }
  .result { text-align: center; padding: 18px 16px; margin-top: 16px; }
  .result .name { font-size: 26px; font-weight: 700; min-height: 39px; word-break: break-all; }
  .result .meta { color: var(--muted); margin-top: 4px; min-height: 22px; }
  .result.pop { animation: pop 300ms var(--ease-out); }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 15px; background: var(--line); color: var(--text); transition: transform 160ms var(--ease-out); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn.big { width: 100%; padding: 16px; font-size: 20px; font-weight: 600; border-radius: 14px; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 15px; background: #fff; color: var(--text); font-family: inherit; }
  textarea { min-height: 180px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; margin: 10px 0 0; }
  .check input { width: auto; }
  .field { margin-bottom: 12px; }
  .shop-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .shop-title h3 { margin: 0; font-size: 17px; }
  .dish { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .dish .info { flex: 1; min-width: 0; }
  .dish .info .n { font-weight: 600; }
  .dish.off .info { opacity: .4; text-decoration: line-through; }
  .tag { display: inline-block; font-size: 12px; background: #fff0e8; color: var(--primary-dark); border-radius: 6px; padding: 0 6px; margin-right: 4px; }
  .price { color: var(--primary-dark); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .btn { flex: 1; white-space: nowrap; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; z-index: 10;
    opacity: 0; visibility: hidden; transition: opacity 200ms var(--ease-out), visibility 0s 200ms; }
  .mask.show { opacity: 1; visibility: visible; transition: opacity 250ms var(--ease-out); }
  .sheet { background: #fff; width: 100%; max-height: 90%; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px 16px 24px;
    transform: translateY(100%); transition: transform 200ms var(--ease-out); }
  .mask.show .sheet { transition: transform 320ms var(--ease-drawer); }
  .mask.show .sheet { transform: none; }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .hist { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
  .hist:first-child { border-top: 0; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 20;
    opacity: 0; visibility: hidden; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out), visibility 0s 150ms; transform: translate(-50%, 8px); }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  /* 减少动画：保留透明度变化，去掉位移和缩放 */
  @media (prefers-reduced-motion: reduce) {
    .sheet, .mask.show .sheet { transform: none !important; }
    .mask .sheet { opacity: 0; transition: opacity 200ms; } .mask.show .sheet { opacity: 1; }
    .toast, .toast.show { transform: translate(-50%, 0); }
    .btn:active, .hub:active { transform: none; } .hub:active { transform: translate(-50%,-50%); }
    .hub.idle::after { animation: none; }
    @keyframes pop { from { opacity: 0; } }
  }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  pre.hint { background: #fff8f3; border-radius: 8px; padding: 10px; font-size: 13px; white-space: pre-wrap; margin: 0 0 10px; }
</style>
</head>
<body>
<header id="title">今天吃什么</header>

<main>
  <!-- 抽签 -->
  <section class="page active" id="page-pick">
    <div class="wheel-wrap">
      <svg class="pointer" id="pointer" viewBox="0 0 30 40"><path d="M15 40 L3 10 A12 12 0 1 1 27 10 Z" fill="#2b2118"/><circle cx="15" cy="12" r="5" fill="#fff"/></svg>
      <div class="wheel-disc"><canvas id="wheel"></canvas></div>
      <button class="hub idle" id="btn-roll">转！</button>
    </div>
    <div class="card result" id="result">
      <div class="name" id="r-name">今天吃什么？</div>
      <div class="meta" id="r-meta">点转盘中间的按钮</div>
    </div>
    <div class="row" id="after-roll" hidden>
      <button class="btn" id="btn-again">换一个</button>
      <button class="btn ok" id="btn-accept">就吃这个！</button>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row">
        <div><label>店铺</label><select id="f-shop"></select></div>
        <div><label>分类</label><select id="f-tag"></select></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>预算上限（元，留空不限）</label><input id="f-budget" type="number" inputmode="decimal" min="0"></div>
        <div><label>一次抽几道</label><select id="f-count"><option>1</option><option>2</option><option>3</option></select></div>
      </div>
      <label class="check"><input type="checkbox" id="f-avoid" checked>避开最近吃过的 3 道</label>
      <div class="muted" style="margin-top:8px" id="pool-info"></div>
    </div>
  </section>

  <!-- 菜单 -->
  <section class="page" id="page-menu">
    <div class="toolbar">
      <button class="btn primary" id="btn-ai">📷 AI 识别菜单</button>
      <button class="btn primary" id="btn-add-dish">＋ 菜品</button>
      <button class="btn" id="btn-add-shop">＋ 店铺</button>
      <button class="btn" id="btn-import">批量导入</button>
      <button class="btn" id="btn-backup">备份/恢复</button>
    </div>
    <div id="menu-list"></div>
  </section>

  <!-- 记录 -->
  <section class="page" id="page-hist">
    <div class="card" id="hist-list"></div>
    <button class="btn" id="btn-clear-hist" style="width:100%">清空记录</button>
  </section>
</main>

<nav>
  <button class="active" data-page="pick"><b>🎲</b>抽签</button>
  <button data-page="menu"><b>📋</b>菜单</button>
  <button data-page="hist"><b>🕘</b>记录</button>
</nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<script>
(function () {
  'use strict';
  var KEY = 'food_picker_v1';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  // ---------- 数据 ----------
  var data = load();
  function sample() {
    var s1 = uid(), s2 = uid();
    return {
      shops: [{ id: s1, name: '示例·川菜馆' }, { id: s2, name: '示例·面馆' }],
      dishes: [
        { id: uid(), shopId: s1, name: '宫保鸡丁饭', price: 22, tags: ['盖饭'], on: true },
        { id: uid(), shopId: s1, name: '鱼香肉丝饭', price: 20, tags: ['盖饭'], on: true },
        { id: uid(), shopId: s1, name: '麻婆豆腐饭', price: 16, tags: ['盖饭', '素'], on: true },
        { id: uid(), shopId: s2, name: '红烧牛肉面', price: 25, tags: ['面'], on: true },
        { id: uid(), shopId: s2, name: '酸辣粉', price: 14, tags: ['粉'], on: true }
      ],
      history: []
    };
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.shops) && Array.isArray(d.dishes)) { d.history = d.history || []; return d; }
    } catch (e) {}
    return sample();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('保存失败：' + e.message); }
  }
  function shopName(id) { var s = data.shops.find(function (x) { return x.id === id; }); return s ? s.name : '未分店铺'; }
  function allTags() {
    var set = {};
    data.dishes.forEach(function (d) { (d.tags || []).forEach(function (t) { set[t] = 1; }); });
    return Object.keys(set).sort();
  }
  function priceText(p) { return p === '' || p == null || isNaN(p) ? '' : '¥' + (+p); }

  // ---------- 通用 ----------
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }
  function openSheet(html) { $('sheet').innerHTML = html; $('mask').classList.add('show'); }
  function closeSheet() { $('mask').classList.remove('show'); }
  $('mask').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  function copyText(text) {
    if (window.Android && Android.copy) { Android.copy(text); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast('已复制'); });
  }

  var current = 'pick';
  function go(page) {
    current = page;
    document.querySelectorAll('.page').forEach(function (p) { p.classList.toggle('active', p.id === 'page-' + page); });
    document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.page === page); });
    $('title').textContent = { pick: '今天吃什么', menu: '我的菜单', hist: '吃过的记录' }[page];
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav button').forEach(function (b) { b.onclick = function () { go(b.dataset.page); }; });

  // 安卓返回键：先关弹窗，再回首页，最后才退出
  window.handleBack = function () {
    if ($('mask').classList.contains('show')) { closeSheet(); return true; }
    if (current !== 'pick') { go('pick'); return true; }
    return false;
  };

  // ---------- 抽签 ----------
  function pool() {
    var shop = $('f-shop').value, tag = $('f-tag').value, budget = parseFloat($('f-budget').value);
    var recent = $('f-avoid').checked ? data.history.slice(0, 3).map(function (h) { return h.dishId; }) : [];
    return data.dishes.filter(function (d) {
      if (!d.on) return false;
      if (shop && d.shopId !== shop) return false;
      if (tag && (d.tags || []).indexOf(tag) < 0) return false;
      if (!isNaN(budget) && d.price !== '' && d.price != null && +d.price > budget) return false;
      return recent.indexOf(d.id) < 0;
    });
  }
  function pickN(list, n) {
    var arr = list.slice(), out = [];
    while (arr.length && out.length < n) out.push(arr.splice(Math.floor(Math.random() * arr.length), 1)[0]);
    return out;
  }
  function renderFilters() {
    var fs = $('f-shop'), ft = $('f-tag'), vs = fs.value, vt = ft.value;
    fs.innerHTML = '<option value="">全部店铺</option>' + data.shops.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');
    ft.innerHTML = '<option value="">全部分类</option>' + allTags().map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
    fs.value = vs; if (fs.value !== vs) fs.value = '';
    ft.value = vt; if (ft.value !== vt) ft.value = '';
    updatePoolInfo();
  }
  function updatePoolInfo() {
    var list = pool();
    $('pool-info').textContent = '符合条件的菜品：' + list.length + ' 道' + (list.length > WHEEL_MAX ? '（转盘上随机展示 ' + WHEEL_MAX + ' 道，每道被抽中的概率相同）' : '');
    if (!spinning) { slots = sampleSlots(list, null); drawWheel(); }
  }
  ['f-shop', 'f-tag', 'f-budget', 'f-avoid'].forEach(function (id) { $(id).addEventListener('input', updatePoolInfo); $(id).addEventListener('change', updatePoolInfo); });

  // ---------- 转盘 ----------
  var WHEEL_MAX = 12;
  var COLORS = ['#ff6b35', '#ffb547', '#ff8a5c', '#f25c54', '#ffcf70', '#ff9f43', '#e8505b', '#ffa26b'];
  var slots = [], rotation = 0, spinning = false, picked = [];
  var cv = $('wheel'), ctx = cv.getContext('2d');
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function vibrate(ms) {
    try { if (window.Android && Android.vibrate) Android.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }
  // 转盘最多放 WHEEL_MAX 道；must 为必须出现在盘上的菜（本次中奖的那道）
  function sampleSlots(list, must) {
    var others = pickN(list.filter(function (d) { return d !== must; }), must ? WHEEL_MAX - 1 : WHEEL_MAX);
    if (must) others.splice(Math.floor(Math.random() * (others.length + 1)), 0, must);
    return others;
  }
  function fitCanvas() {
    var r = window.devicePixelRatio || 1, w = cv.clientWidth || 300;
    if (cv.width !== Math.round(w * r)) { cv.width = cv.height = Math.round(w * r); }
  }
  function clip(text, max) { return text.length > max ? text.slice(0, max - 1) + '…' : text; }
  function drawWheel() {
    fitCanvas();
    var W = cv.width, R = W / 2, n = slots.length;
    ctx.clearRect(0, 0, W, W);
    ctx.save(); ctx.translate(R, R);
    // 外圈
    ctx.beginPath(); ctx.arc(0, 0, R - 2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    var r = R * 0.92;
    if (!n) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#eee3da'; ctx.fill();
      ctx.fillStyle = '#8a7a6d'; ctx.font = (R * 0.08) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('没有可选的菜品', 0, -R * 0.45);
      ctx.restore(); return;
    }
    var a = Math.PI * 2 / n;
    var fs = Math.max(R * 0.055, Math.min(R * 0.09, R * 0.75 / n));
    for (var i = 0; i < n; i++) {
      var s0 = -Math.PI / 2 + i * a;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, s0, s0 + a); ctx.closePath();
      ctx.fillStyle = n === 1 ? COLORS[0] : COLORS[(i % COLORS.length === 0 && i === n - 1) ? 1 : i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, R * 0.008); ctx.stroke();
      // 文字沿半径方向
      // 文字沿半径朝外排，和实体转盘一样（整盘会转，不做左右翻转）
      ctx.save(); ctx.rotate(s0 + a / 2);
      ctx.fillStyle = '#fff'; ctx.font = '600 ' + fs + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3;
      ctx.fillText(clip(slots[i].name, n > 8 ? 6 : 8), r - R * 0.07, 0);
      ctx.restore();
    }
    // 外圈灯珠
    for (var k = 0; k < 24; k++) {
      var t = k / 24 * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(t) * (R * 0.96), Math.sin(t) * (R * 0.96), R * 0.018, 0, Math.PI * 2);
      ctx.fillStyle = k % 2 ? '#ffd27a' : '#ff6b35'; ctx.fill();
    }
    ctx.restore();
    applyRotation();
  }
  // 盘面只画一次，转动交给 GPU：只改 canvas 的 transform
  function applyRotation() { cv.style.transform = 'rotate(' + rotation + 'rad)'; }
  // 指针被扇区分界处的"钉子"拨动：刚越过分界时偏得最多，随后弹回
  function setPointer(kick) { $('pointer').style.transform = kick ? 'rotate(' + (-kick) + 'deg)' : ''; }
  function indexAtPointer() {
    var n = slots.length, a = Math.PI * 2 / n;
    var off = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(off / a) % n;
  }
  function spinTo(winner, list, duration) {
    return new Promise(function (resolve) {
      if (slots.indexOf(winner) < 0) { slots = sampleSlots(list, winner); drawWheel(); }
      var n = slots.length, a = Math.PI * 2 / n, w = slots.indexOf(winner);
      var target = -(w + 0.2 + Math.random() * 0.6) * a;           // 落在扇区中间附近，不压线
      var base = rotation % (Math.PI * 2);
      var delta = ((target - base) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var from = rotation, to = rotation + delta + Math.PI * 2 * (5 + Math.floor(Math.random() * 3));
      if (REDUCED) { to = rotation + delta + Math.PI * 2; duration = 1200; }
      var t0 = performance.now(), last = indexAtPointer();
      var ease = function (t) { return 1 - Math.pow(1 - t, 4); };   // 先快后慢
      (function frame(now) {
        var t = Math.min(1, (now - t0) / duration);
        rotation = from + (to - from) * ease(t);
        applyRotation();
        var idx = indexAtPointer();
        if (idx !== last) {
          last = idx;
          if (t > 0.35) vibrate(8);                                   // 慢下来后才逐格震动
        }
        if (!REDUCED) {
          // 距上一条分界线转过的比例：0 = 刚越过；转得越快，指针越来不及弹回
          var off = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2), f = 1 - (off % a) / a;
          setPointer(f < 0.3 ? 24 * (1 - f / 0.3) : 0);
        }
        if (t < 1) requestAnimationFrame(frame); else { setPointer(0); resolve(); }
      })(t0);
    });
  }

  function showResult() {
    var total = picked.reduce(function (s, d) { return s + (+d.price || 0); }, 0);

    var ps = [], cx = innerWidth / 2, cy = innerHeight * 0.35;
    for (var i = 0; i < 90; i++) {
      var ang = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 7;
      ps.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4, r: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: COLORS[i % COLORS.length] });
    }
    var t0 = performance.now();

      ps.forEach(function (p) {

  // 批量导入：【店铺】开头的行切换店铺，其余每行「菜名 价格 标签…」
  function parseImport(text) {
    var shop = null, added = 0, shops = 0;
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line || /^```/.test(line) || /^\|?[\s:|-]+\|?$/.test(line)) return;
      line = line.replace(/\*\*|__/g, '').replace(/^(?:[-*+•]|\d+[.、)])\s+/, '').replace(/^\||\|$/g, '').trim();
      if (!line || /^(菜名|菜品|名称)\s*[|\s]/.test(line)) return;
      var m = line.match(/^(?:【(.+?)】|\[(.+?)\]|#+\s*(.+)|店铺[:：]\s*(.+))$/);
      if (m) {
        var name = (m[1] || m[2] || m[3] || m[4]).trim();
        shop = data.shops.find(function (s) { return s.name === name; });
        if (!shop) { shop = { id: uid(), name: name }; data.shops.push(shop); shops++; }
        return;
      }
      if (!shop) {
        shop = data.shops.find(function (s) { return s.name === '未命名店铺'; });
        if (!shop) { shop = { id: uid(), name: '未命名店铺' }; data.shops.push(shop); shops++; }
      }
      var parts = line.replace(/[¥￥]/g, ' ').replace(/元/g, ' ').split(/[\s,，\t|]+/).filter(Boolean);
      var priceIdx = -1;
      for (var i = 1; i < parts.length; i++) if (/^\d+(\.\d+)?$/.test(parts[i])) { priceIdx = i; break; }
      var dishName = (priceIdx > 0 ? parts.slice(0, priceIdx) : parts.slice(0, 1)).join(' ');
      var price = priceIdx > 0 ? +parts[priceIdx] : '';
      var tags = priceIdx > 0 ? parts.slice(priceIdx + 1) : parts.slice(1);
      var exist = data.dishes.find(function (d) { return d.shopId === shop.id && d.name === dishName; });
      if (exist) { exist.price = price === '' ? exist.price : price; if (tags.length) exist.tags = tags; return; }
      data.dishes.push({ id: uid(), shopId: shop.id, name: dishName, price: price, tags: tags, on: true });
      added++;
    });
    return { added: added, shops: shops };
  }

  // 读图并压缩成 JPEG base64；超长截图切成几段，避免被模型缩得看不清
  function loadImages(files) {
    return Promise.all(Array.prototype.map.call(files, function (f) {
      return new Promise(function (res, rej) {
        var url = URL.createObjectURL(f), img = new Image();
        img.onload = function () {
          var out = [], w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, 1280 / w), sliceH = Math.round(w * 2);
          for (var y = 0; y < h; y += sliceH) {
            var sh = Math.min(sliceH, h - y), cv = document.createElement('canvas');
            cv.width = Math.round(w * scale); cv.height = Math.round(sh * scale);
            cv.getContext('2d').drawImage(img, 0, y, w, sh, 0, 0, cv.width, cv.height);
            out.push(cv.toDataURL('image/jpeg', 0.85));
          }
          URL.revokeObjectURL(url); res(out);
        };
        img.onerror = function () { rej(new Error('图片读取失败')); };
        img.src = url;
      });
    })).then(function (lists) { return [].concat.apply([], lists); });
  }

  var httpSeq = 0, httpWait = {};

  function httpPost(url, headers, body) {
    return new Promise(function (res, rej) {
      var done = function (status, text) {
        if (!status) return rej(new Error('网络错误：' + text));
        var j = null; try { j = JSON.parse(text); } catch (e) {}
        if (status >= 400) return rej(new Error('HTTP ' + status + '：' + ((j && j.error && (j.error.message || j.error)) || text).toString().slice(0, 300)));
        if (!j) return rej(new Error('返回内容无法解析'));
        res(j);
      };
      if (window.Android && Android.post) {
        var id = 'h' + (++httpSeq); httpWait[id] = done;
        Android.post(id, url, JSON.stringify(headers), JSON.stringify(body));
      } else {
        fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
          .then(function (r) { return r.text().then(function (t) { done(r.status, t); }); })
          .catch(function (e) { done(0, e.message); });
      }
    });
  }

      '<div class="row" style="margin-top:10px"><button class="btn" id="ai-prompt">没有 Key？复制提示词去豆包/Kimi 用</button></div>');
    $('ai-set').onclick = function () { aiSettings(aiSheet); };
    $('ai-prompt').onclick = function () {
      copyText(AI_PROMPT);
      toast('已复制。把截图和提示词一起发给任意 AI，再把回答粘贴到「批量导入」');
    };
    $('ai-files').onchange = function () {
      var files = this.files;
      if (!files.length) return;
      $('ai-go').disabled = true; $('ai-thumbs').textContent = '处理中…';
      loadImages(files).then(function (list) {
        images = list.slice(0, 20);
        $('ai-thumbs').innerHTML = images.map(function (d) { return '<img src="' + d + '">'; }).join('') +
          (list.length > 20 ? '<div class="muted">图片太多，只取前 20 张</div>' : '');
        $('ai-go').disabled = false;
      }).catch(function (e) { $('ai-thumbs').textContent = e.message; });
    };
    $('ai-go').onclick = function () {
      if (!aiCfg().key) { toast('请先在「AI 设置」里填写 API Key'); return; }
      var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>识别中…';
      recognize(images).then(function (text) {
        openImport(text.trim());
        toast('识别完成，检查无误后点「导入」');
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = '开始识别';
        alert('识别失败：' + e.message);
      });
    };
  }
  $('btn-ai').onclick = aiSheet;

  $('btn-backup').onclick = function () {
    openSheet('<h2>备份 / 恢复</h2>' +
      '<p class="muted">复制下面的内容保存好（比如发给微信「文件传输助手」）；恢复时粘贴进来点「恢复」。</p>' +
      '<div class="field"><textarea id="bk-text">' + esc(JSON.stringify({ shops: data.shops, dishes: data.dishes })) + '</textarea></div>' +
      '<div class="row"><button class="btn" id="bk-copy">复制</button><button class="btn danger" id="bk-restore">恢复（覆盖）</button></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn" id="bk-reset">清空全部菜单</button></div>');
    $('bk-copy').onclick = function () { copyText($('bk-text').value); };
    $('bk-restore').onclick = function () {
      try {
        var d = JSON.parse($('bk-text').value);
        if (!Array.isArray(d.shops) || !Array.isArray(d.dishes)) throw new Error('格式不对');
        if (!confirm('用这份数据覆盖当前菜单？')) return;
        data.shops = d.shops; data.dishes = d.dishes; save(); closeSheet(); render(); toast('已恢复');
      } catch (e) { toast('恢复失败：' + e.message); }
    };
    $('bk-reset').onclick = function () {
      if (!confirm('确定清空所有店铺和菜品？')) return;
      data.shops = []; data.dishes = []; save(); closeSheet(); render();
    };
  };

  // ---------- 记录 ----------
  function renderHist() {
    if (!data.history.length) { $('hist-list').innerHTML = '<div class="empty">还没有记录，抽到喜欢的点「就吃这个」</div>'; return; }
    $('hist-list').innerHTML = data.history.map(function (h) {
      var t = new Date(h.time);
      var ts = (t.getMonth() + 1) + '/' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      return '<div class="hist"><div><b>' + esc(h.name) + '</b> <span class="price">' + priceText(h.price) + '</span><div class="muted">' + esc(h.shop) + '</div></div><div class="muted">' + ts + '</div></div>';
    }).join('');
  }
  $('btn-clear-hist').onclick = function () {
    if (!data.history.length || !confirm('清空所有记录？')) return;
    data.history = []; save(); render();
  };

  function render() {
    if (current === 'pick') renderFilters();
    else if (current === 'menu') renderMenu();
    else renderHist();
  }
  save();
  render();
})();
</script>
</body>
</html>
