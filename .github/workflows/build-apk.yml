name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FoodPicker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoodPicker-apk
          path: FoodPicker.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 今天吃什么 APK（最新构建）
          prerelease: true
          files: FoodPicker.apk
          body: 由 GitHub Actions 自动构建，提交 ${{ github.sha }}。手机下载 FoodPicker.apk 直接安装即可。
